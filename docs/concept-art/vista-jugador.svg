    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.35" stop-color="#c9ced6"/>
      <stop offset="0.6" stop-color="#8a9099"/>
      <stop offset="1" stop-color="#3a3e45"/>
    </linearGradient>
    <linearGradient id="metalFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5f67"/>
      <stop offset="0.4" stop-color="#b4b9c1"/>
      <stop offset="1" stop-color="#4a4e55"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#b9cdea" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7f97bd" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8dc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff8dc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="blurFar"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="shadow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

