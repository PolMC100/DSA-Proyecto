      <stop offset="0" stop-color="#d9cfb8"/>
      <stop offset="1" stop-color="#bfb398"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9875d"/>
      <stop offset="1" stop-color="#6e5232"/>
